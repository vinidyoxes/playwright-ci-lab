name: Playwright CI Lab

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_fail:
        description: 'Enable an intentional failing test'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: playwright-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      DEMO_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_fail || false }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
      - name: Upload report and failure evidence
        if: ${{ !cancelled() && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload results on GitHub Enterprise Server
        if: ${{ !cancelled() && github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
